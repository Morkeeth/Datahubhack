<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nullspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<!--
  THE NUMBERS, AND WHERE THEY COME FROM
  ─────────────────────────────────────
  Read live from a running DataHub at /api/board. Nothing on this page is
  computed from a local file. If the catalog is unreachable the page says so and
  shows nothing, because Nullspace keeps no copy of its own — a board that
  outlives the catalog would prove the catalog was never load-bearing.

    demand        datasetProperties.nullspace.demand on the ghost URN
    requesters    ownership aspect, falling back to nullspace.requesters
    state / tags  globalTags — urn:li:tag:ghost or urn:li:tag:solid
    schema        schemaMetadata on the solid asset
    upstream      lineage(UPSTREAM)
    history       nullspace.resolution, written as each event happened

  THE COLOUR ARGUMENT
  ───────────────────
  Five neutrals and one accent. The accent is spent on the MISS — an asset agents
  wanted and could not get — and nowhere else on the page. When a want becomes
  real its marks turn to ink and the accent leaves it entirely. That is what
  being filled looks like. Nothing is red-as-alarm here: unmet demand is not a
  failure of the system, it is the thing the system exists to show.

  THE MARKS
  ─────────
  One mark is one agent that asked. Countable by eye, assertable in the DOM: the
  marks in a row equal the demand printed beside them, exactly. No rounding, no
  scaling, no chart library, no dependency.

  There is no monospace on this page because there is no code on this page.
-->
<style>
  :root {
    --n0: #ffffff;
    --n1: #f2f1ef;
    --n2: #d8d5d1;
    --n3: #6f6a64;
    --n4: #16150f;
    --accent: #b8482c; /* THE MISS. one region. nowhere else. */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--n0); color: var(--n4);
    font-family: "IBM Plex Sans", sans-serif; font-weight: 300;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem 5rem; }
  h1 { font-weight: 600; font-size: clamp(2rem, 5vw, 2.75rem); letter-spacing: -0.03em; margin: 4rem 0 0.5rem; }
  .lede { color: var(--n3); max-width: 36rem; margin: 0 0 1.5rem; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; font-weight: 600; color: var(--n3); }
  a { color: var(--n4); text-underline-offset: 3px; }
  .meta { color: var(--n3); font-size: 13px; }

  .ledger { border-top: 1px solid var(--n2); margin-top: 2rem; padding-top: 1.25rem;
            display: flex; gap: 3rem; flex-wrap: wrap; }
  .ledger .n { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; display: block; }

  .row { border-top: 1px solid var(--n2); padding: 1.5rem 0; display: grid;
         grid-template-columns: 1fr 16rem; gap: 1.5rem; }
  .row h2 { font-size: 1.25rem; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 0.35rem; }
  .urn { color: var(--n3); font-size: 12px; overflow-wrap: anywhere; margin: 0.25rem 0 0.75rem; }
  .count { font-weight: 600; font-size: 1.125rem; margin-bottom: 0.35rem; }
  .marks { display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; }
  .m { width: 7px; height: 14px; background: var(--n4); display: block; }
  .m.miss { background: var(--accent); }

  .facts { margin-top: 0.75rem; }
  .facts div { font-size: 13px; margin-bottom: 0.2rem; }
  .facts .k { color: var(--n3); display: inline-block; min-width: 7.5rem; }
  .history { margin-top: 1rem; }
  .history div { font-size: 12px; color: var(--n3); margin-bottom: 0.15rem; }
  .history .t { display: inline-block; min-width: 5rem; }
  .history .e { display: inline-block; min-width: 8rem; color: var(--n4); }

  .waiting, .gone { border: 1px solid var(--n2); padding: 3rem 2rem; margin-top: 2rem; color: var(--n3); }
  .gone h2 { color: var(--n4); font-weight: 400; margin: 0 0 0.75rem; }
  .limits { border-top: 1px solid var(--n2); margin-top: 3rem; padding-top: 1.25rem;
            color: var(--n3); font-size: 13px; max-width: 40rem; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Nullspace</h1>
  <p class="lede">
    A catalog entry for data that does not exist yet. Agents search DataHub, miss,
    and the miss becomes the record. One mark is one agent that asked.
  </p>
  <p class="label"><a href="/order-book">the order book →</a></p>

  <div class="ledger" id="ledger"></div>
  <div id="rows"></div>
  <div class="limits" id="limits"></div>
</div>

<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clock(ms){ return ms ? new Date(ms).toTimeString().slice(0,8) : '--:--:--'; }
// One mark is one agent. Never rounded — the DOM is assertable against the
// printed figure beside it.
function marks(n, miss){ return Array.from({length:n},()=>`<i class="m${miss?' miss':''}"></i>`).join(''); }

// The history is a receipt, so it reads as English rather than as a JSON blob
// pasted into a page.
function detail(e){
  const raw = e.detail; if(!raw) return '';
  if(!String(raw).trim().startsWith('{')) return raw;
  let d; try { d = JSON.parse(raw); } catch { return raw; }
  if(e.event === 'sql_validated')
    return `${d.status} against ${d.source_relation} — ${(d.returned_columns||[]).length} columns, ${d.sample_row_count} rows sampled`;
  if(e.event === 'solidify')
    return `${(d.fields||[]).length} fields, ${(d.upstreams||[]).length} upstream, schema from the requesters' own queries`;
  if(e.event === 'pr_merged') return `merged — ${d.url||''}`;
  return Object.entries(d).map(([k,v])=>`${k}=${Array.isArray(v)?v.length:v}`).join(' ');
}

function row(g){
  const solid = g.state === 'solid';
  const fields = (g.schema_fields||[]).map(f => typeof f === 'string' ? f : f.name).filter(Boolean);
  return `<div class="row" data-want="${esc(g.want)}">
    <div>
      <h2>${esc(g.want)}</h2>
      <div class="label">${esc(g.state)}</div>
      <p class="urn">${esc(g.urn)}</p>
      <div class="facts">
        ${(g.requesters||[]).length ? `<div><span class="k">asked by</span>${g.requesters.map(esc).join(', ')}</div>` : ''}
        ${solid && fields.length ? `<div><span class="k">schema</span>${fields.map(esc).join(', ')}</div>` : ''}
        ${solid && g.schema_source ? `<div><span class="k">derived by</span>${esc(g.schema_source)}</div>` : ''}
        ${solid && (g.upstream_urns||[]).length ? `<div><span class="k">upstream</span>${esc(g.upstream_urns[0])}</div>` : ''}
        ${g.pr_url && /^https?:/.test(g.pr_url)
          ? `<div><span class="k">pull request</span><a href="${esc(g.pr_url)}" target="_blank" rel="noreferrer">${esc(g.pr_url)}</a></div>` : ''}
      </div>
      <div class="history">${(g.resolution||[]).slice(-7).map(e =>
        `<div><span class="t">${clock(e.at_ms)}</span><span class="e">${esc(e.event)}</span>${esc(detail(e))}</div>`).join('')}</div>
    </div>
    <div>
      <div class="count">${g.demand}</div>
      <div class="marks">${marks(g.demand, !solid)}</div>
      <div class="meta">${solid ? 'now it exists' : 'agents asked'}</div>
    </div>
  </div>`;
}

async function refresh(){
  let d; try { d = await (await fetch('/api/board')).json(); } catch(e){ return; }

  if (d.catalog && d.catalog !== 'live') {
    document.getElementById('ledger').innerHTML = '';
    document.getElementById('rows').innerHTML =
      `<div class="gone"><h2>The catalog is gone, so this is gone.</h2>
       <p>${esc(d.reason||'')}</p><p class="meta">${esc(d.source||'')} — ${esc(d.detail||'')}</p></div>`;
    return;
  }

  const g = d.ghosts || [], c = d.counts || {};
  const asked = g.reduce((n,x)=>n+(x.demand||0),0);
  const voices = new Set(g.flatMap(x=>x.requesters||[])).size;

  document.getElementById('ledger').innerHTML = `
    <div><span class="n">${c.ghost||0}</span><span class="label">asked for, not built</span></div>
    <div><span class="n">${c.claimed||0}</span><span class="label">being built</span></div>
    <div><span class="n">${c.solid||0}</span><span class="label">made real</span></div>
    <div><span class="n">${asked}</span><span class="label">requests from ${voices} agents</span></div>`;

  const shown = g.slice(0, 12);
  document.getElementById('rows').innerHTML = shown.length
    ? shown.map(row).join('') + (g.length > shown.length
        ? `<div class="waiting">and ${g.length - shown.length} more in the catalog — the order book ranks them.</div>` : '')
    : `<div class="waiting">No agent has missed yet. The board fills when one does.</div>`;
}

document.getElementById('limits').innerHTML =
  `<p class="label">What this page cannot see</p>
   <p>Requester identities and warehouse rows are disclosed demo traffic; the misses behind
   them are genuine. Every figure here is read back from a running DataHub — this page holds
   no copy of its own, which is why it goes blank rather than stale when the catalog stops
   answering.</p>`;

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
