<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nullspace — the order book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<!--
  THE NUMBERS ON THIS PAGE, AND WHERE THEY COME FROM
  ──────────────────────────────────────────────────
  Every figure is read live from a running DataHub at /api/order-book. Nothing is
  computed from a local file and nothing is a fixture; if the catalog is
  unreachable this page shows nothing rather than a stale copy.

    demand per want      datasetProperties.nullspace.demand on the ghost URN
    who asked            ownership aspect, falling back to nullspace.requesters
    open since           earliest at_ms in nullspace.resolution
    schema delivered     schemaMetadata on the solid asset
    upstream             lineage(UPSTREAM).total
    pull request         nullspace.pr_url
    queries now running  /api/unblocked — the ONE number here that is not
                         metadata. It is the registered queries executed in a
                         READ ONLY transaction, because "these agents are no
                         longer blocked" is a claim only a query can settle.

  Requester identities and warehouse rows are disclosed demo traffic. The misses
  behind them are genuine Postgres `relation ... does not exist` errors.

  THE COLOUR ARGUMENT
  ───────────────────
  Five neutrals and one accent. The accent is spent on the MISS — demand that has
  not been filled — and nowhere else. It is never on the headline, never on what
  succeeded, never twice. A want that was built loses the accent entirely: that
  is what being filled looks like. Nothing here is red-as-alarm, because nothing
  here is broken; unmet demand is not an error, it is the product.

  THE MARKS
  ─────────
  One mark is one agent that asked. The marks are countable by eye and assertable
  in the DOM: the marks inside a row equal that row's printed demand exactly. The
  two lanes below the header are at one shared scale. The built lane is nearly
  empty. That is not a rendering bug and must not be "fixed" — it is the most
  honest image on the page.
-->
<style>
  :root {
    --n0: #ffffff;   /* page */
    --n1: #f2f1ef;   /* rails */
    --n2: #d8d5d1;   /* hairlines */
    --n3: #6f6a64;   /* secondary text */
    --n4: #16150f;   /* ink */
    --accent: #b8482c; /* THE MISS. one region. nowhere else. */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--n0); color: var(--n4);
    font-family: "IBM Plex Sans", sans-serif; font-weight: 300;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 62rem; margin: 0 auto; padding: 0 1.5rem 5rem; }

  h1 { font-weight: 600; font-size: clamp(2rem, 5vw, 2.75rem); letter-spacing: -0.03em; margin: 4rem 0 0.5rem; }
  .lede { color: var(--n3); max-width: 34rem; margin: 0 0 1.5rem; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; font-weight: 600; color: var(--n3); }
  a { color: var(--n4); text-underline-offset: 3px; }

  /* two lanes, one shared scale */
  .lanes { border-top: 1px solid var(--n2); padding-top: 1.5rem; margin: 2rem 0 3rem; }
  .lane { margin-bottom: 1.75rem; }
  .lane .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .lane .n { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; }
  .marks { display: flex; flex-wrap: wrap; gap: 3px; }
  .m { width: 7px; height: 14px; background: var(--n4); display: block; }
  .m.miss { background: var(--accent); }
  .lane.empty .marks::after {
    content: "none"; font-size: 10px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--n3);
  }

  .row { border-top: 1px solid var(--n2); padding: 1.25rem 0; display: grid; grid-template-columns: 1fr 16rem; gap: 1.5rem; }
  .row h2 { font-size: 1.0625rem; font-weight: 400; margin: 0 0 0.3rem; }
  .meta { color: var(--n3); font-size: 13px; }
  .count { font-weight: 600; font-size: 1.125rem; margin-bottom: 0.35rem; }
  .row .marks { align-content: flex-start; }
  .tail { color: var(--n3); padding: 1.25rem 0 0; border-top: 1px solid var(--n2); max-width: 38rem; }
  h3.sec { font-size: 10px; text-transform: uppercase; letter-spacing: .2em; font-weight: 600; color: var(--n3); margin: 3rem 0 0; }

  /* the ending — literal SQL, so mono is allowed here and only here */
  .q { margin: 1.25rem 0; }
  .q .sql { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--n3); display: block; margin: 0.3rem 0; overflow-wrap: anywhere; }
  .q table { border-collapse: collapse; margin-top: 0.4rem; }
  .q td, .q th { padding: 0.1rem 1.5rem 0.1rem 0; font-size: 13px; text-align: left; font-weight: 400; }
  .q th { color: var(--n3); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }

  .limits { border-top: 1px solid var(--n2); margin-top: 3rem; padding-top: 1.25rem; color: var(--n3); font-size: 13px; max-width: 40rem; }
  .gone { border: 1px solid var(--n2); padding: 3rem 2rem; margin-top: 2rem; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>The order book</h1>
  <p class="lede">What your agents needed and could not get. One mark is one agent that asked.</p>
  <p class="label"><a href="/">← the demand board</a></p>

  <div id="lanes" class="lanes"></div>
  <div id="body"></div>
  <div class="limits" id="limits"></div>
</div>

<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ago(ms){
  if(!ms) return '—';
  const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<90) return Math.round(s)+'s';
  if(s<5400) return Math.round(s/60)+' min';
  if(s<172800) return Math.round(s/3600)+' h';
  return Math.round(s/86400)+' d';
}
// One mark is one agent. Never a rounded count — the DOM has to be assertable
// against the real number, and the exact figure is printed beside the marks.
function marks(n, miss){
  return Array.from({length:n},()=>`<i class="m${miss?' miss':''}"></i>`).join('');
}

function row(r, built){
  return `<div class="row" data-want="${esc(r.want)}">
    <div>
      <h2>${esc(r.want)}</h2>
      <div class="meta">${built
        ? `built in ${r.time_to_fill_ms ? Math.round(r.time_to_fill_ms/1000)+'s' : '—'} · ${r.upstream_total} upstream${
            r.fields && r.fields.length ? ' · ' + r.fields.map(esc).join(', ') : ''}`
        : `open ${ago(r.first_asked_ms)} · ${r.blocked_agents} still blocked`}</div>
      <div class="meta">${(r.requesters||[]).slice(0,3).map(esc).join(', ')}${
        (r.requesters||[]).length>3 ? ` and ${r.requesters.length-3} more` : ''}</div>
      ${built && r.pr_url && /^https?:/.test(r.pr_url)
        ? `<div class="meta"><a href="${esc(r.pr_url)}" target="_blank" rel="noreferrer">the pull request</a></div>` : ''}
    </div>
    <div>
      <div class="count">${r.demand}</div>
      <div class="marks">${marks(r.demand, !built)}</div>
    </div>
  </div>`;
}

async function refresh(){
  let d; try { d = await (await fetch('/api/order-book')).json(); } catch(e){ return; }

  if (d.catalog && d.catalog !== 'live') {
    document.getElementById('lanes').innerHTML = '';
    document.getElementById('body').innerHTML =
      `<div class="gone"><h2>The catalog is gone, so this is gone.</h2><p class="meta">${esc(d.reason||'')}</p></div>`;
    return;
  }

  const t = d.totals, open = d.open || [], built = d.filled || [];
  const capped = Math.min(t.unmet_requests, 300);

  // Two lanes, one shared scale, same mark width. The built lane is nearly
  // empty and that is the argument — it does not get padded.
  document.getElementById('lanes').innerHTML = `
    <div class="lane">
      <div class="head"><span class="label">Wanted, not built</span><span class="n">${t.unmet_requests}</span></div>
      <div class="marks">${marks(capped, true)}</div>
      ${capped < t.unmet_requests ? `<p class="meta">first ${capped} of ${t.unmet_requests} drawn</p>` : ''}
    </div>
    <div class="lane ${t.requests_unblocked ? '' : 'empty'}">
      <div class="head"><span class="label">Wanted, and built</span><span class="n">${t.requests_unblocked}</span></div>
      <div class="marks">${marks(t.requests_unblocked, false)}</div>
    </div>
    <p class="meta">${t.open_orders} tables, ${t.blocked_agents} agents waiting. ${t.filled} built.</p>`;

  document.getElementById('body').innerHTML =
    `<h3 class="sec">Unfilled — ranked by how many agents are waiting</h3>
     ${open.slice(0,10).map(r=>row(r,false)).join('')}
     ${open.length>10 ? `<div class="tail">and ${open.length-10} more, wanted by ${
        open.slice(10).reduce((n,r)=>n+r.demand,0)} agents between them. The long tail is most of the backlog.</div>` : ''}
     <h3 class="sec">Built because the demand was visible</h3>
     ${built.length ? built.map(r=>row(r,true)).join('') : `<div class="tail">Nothing built yet.</div>`}
     <div id="ran"></div>`;

  if (built.length) showRan(built[0].want);
}

async function showRan(want){
  let d; try { d = await (await fetch('/api/unblocked?want='+encodeURIComponent(want))).json(); } catch(e){ return; }
  const el = document.getElementById('ran'); if(!el) return;
  if (d.status === 'disabled') { el.innerHTML = `<div class="tail">${esc(d.reason)}</div>`; return; }
  if (d.status !== 'verified') return;
  el.innerHTML = `<h3 class="sec">${d.runs} of ${d.total} queries that could not run, now run</h3>
    ${d.queries.map(q=>`
      <div class="q">
        <span class="label">${esc(q.agent_id)}</span>
        <span class="sql">${esc(q.sql)}</span>
        ${q.status==='runs'
          ? `<table><tr>${(q.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${
              (q.rows||[]).map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`
          : `<span class="meta">still blocked — ${esc(q.error||'')}</span>`}
      </div>`).join('')}
    <p class="meta">None of these agents asked again. Verified by ${esc(d.verified_by)}.</p>`;
}

document.getElementById('limits').innerHTML =
  `<p class="label">What this page cannot see</p>
   <p>Requester identities and warehouse rows are disclosed demo traffic; the misses behind
   them are genuine Postgres <em>relation does not exist</em> errors read from the server's
   own log. Demand counts independent requesters, so a dashboard refreshing every ten
   minutes is one agent, not a hundred and forty-four. Everything above is read live from
   DataHub — except the queries at the end, which are executed, because that claim cannot
   be settled by metadata.</p>`;

refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
