[project]
name = "nullspace"
version = "0.1.0"
description = "Demand-side metadata: ghost datasets for data that does not exist yet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "acryl-datahub[datahub-rest]>=0.14.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nullspace = "nullspace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nullspace"]

[tool.pytest.ini_options]
testpaths = ["nullspace/tests"]
