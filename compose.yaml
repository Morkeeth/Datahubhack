name: nullspace

# A self-contained local substrate: DataHub OSS, a writable warehouse, and
# metadata ingestion. From a clean clone, `docker compose up` is the only
# command required.
x-datahub-storage: &datahub-storage
  DATAHUB_BASE_PATH: /
  DATAHUB_GMS_BASE_PATH: /
  DATAHUB_GMS_HOST: datahub-gms
  DATAHUB_GMS_PORT: "8080"
  DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT:-nullspace-local-demo-salt}
  DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY:-nullspace-local-demo-signing-key-change-me}
  EBEAN_DATASOURCE_DRIVER: com.mysql.jdbc.Driver
  EBEAN_DATASOURCE_HOST: mysql:3306
  EBEAN_DATASOURCE_PASSWORD: datahub
  EBEAN_DATASOURCE_URL: jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2
  EBEAN_DATASOURCE_USERNAME: root
  ELASTICSEARCH_HOST: search
  ELASTICSEARCH_IMPLEMENTATION: opensearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: "false"
  ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
  ENTITY_VERSIONING_ENABLED: "true"
  GRAPH_SERVICE_IMPL: elasticsearch
  KAFKA_BOOTSTRAP_SERVER: broker:29092
  KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
  SCHEMA_REGISTRY_TYPE: INTERNAL

services:
  kafka-broker:
    image: confluentinc/cp-kafka:8.2.2
    hostname: broker
    command:
      - /bin/bash
      - -c
      - |
        file_path="/var/lib/kafka/data/clusterID"
        if [ ! -f "$$file_path" ]; then
          kafka-storage random-uuid > "$$file_path"
          kafka-storage format --ignore-formatted \
            -t "$$(cat "$$file_path")" \
            -c /etc/kafka/kafka.properties
        fi
        export CLUSTER_ID="$$(cat "$$file_path")"
        exec /etc/confluent/docker/run
    environment:
      KAFKA_ADVERTISED_LISTENERS: BROKER://broker:29092,EXTERNAL://localhost:9092
      KAFKA_BROKER_ID: "1"
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:39092
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: BROKER://broker:29092,EXTERNAL://broker:9092,CONTROLLER://broker:39092
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.image.loader.MetadataLoader=WARN
      KAFKA_MAX_MESSAGE_BYTES: "5242880"
      KAFKA_MESSAGE_MAX_BYTES: "5242880"
      KAFKA_NODE_ID: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_PROCESS_ROLES: controller,broker
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server broker:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
    ports:
      - "9092:9092"
    volumes:
      - datahub-broker:/var/lib/kafka/data

  datahub-mysql:
    image: mysql:8.2
    hostname: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: datahub
      MYSQL_PASSWORD: datahub
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_USER: datahub
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h mysql -u $$MYSQL_USER --password=$$MYSQL_PASSWORD"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - datahub-mysql:/var/lib/mysql

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    hostname: search
    environment:
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx1024m -Dlog4j2.formatMsgNoLookups=true
      discovery.type: single-node
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://search:9200/_cluster/health?wait_for_status=yellow&timeout=0s"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 60s
    volumes:
      - datahub-opensearch:/usr/share/opensearch/data

  datahub-upgrade:
    image: acryldata/datahub-upgrade:v1.7.0
    hostname: datahub-system-update
    command: ["-u", "SystemUpdate"]
    depends_on:
      kafka-broker:
        condition: service_healthy
      datahub-mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      <<: *datahub-storage
      BACKFILL_BROWSE_PATHS_V2: "true"
      CREATE_USER: "false"
      CREATE_USER_PASSWORD: datahub
      CREATE_USER_USERNAME: datahub
      DATAHUB_PRECREATE_TOPICS: "true"
      DATAHUB_SQL_SETUP_ENABLED: "true"
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS: "3"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      PARTITIONS: "3"
      SCHEMA_REGISTRY_SYSTEM_UPDATE: "true"
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: "true"
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: "true"
      USE_CONFLUENT_SCHEMA_REGISTRY: "false"
    labels:
      datahub_setup_job: "true"

  datahub-gms:
    image: acryldata/datahub-gms:v1.7.0
    hostname: datahub-gms
    depends_on:
      datahub-upgrade:
        condition: service_completed_successfully
    environment:
      <<: *datahub-storage
      ALTERNATE_MCP_VALIDATION: "true"
      CONFIG_ENTITY_REGISTRY_USE_OPTIMIZED_LOADING: "true"
      DATAHUB_OBJECT_STORAGE_URI: file:///tmp/datahub-object-storage
      DATAHUB_SERVER_TYPE: quickstart
      DATAHUB_TELEMETRY_ENABLED: "false"
      ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: "true"
      ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: "true"
      ELASTICSEARCH_LIMIT_RESULTS_STRICT: "true"
      ENTITY_SERVICE_ENABLE_RETENTION: "true"
      ES_BULK_REFRESH_POLICY: NONE
      GRAPH_SERVICE_DIFF_MODE_ENABLED: "true"
      JAVA_OPTS: -Xms1g -Xmx1g
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      MCL_CONSUMER_BATCH_ENABLED: "true"
      MCP_CONSUMER_BATCH_ENABLED: "true"
      METADATA_SERVICE_AUTH_ENABLED: "false"
      PE_CONSUMER_ENABLED: "true"
      SCHEMA_REGISTRY_TYPE: INTERNAL
      STRICT_URN_VALIDATION_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://datahub-gms:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 90s
    ports:
      - "8080:8080"

  datahub-frontend:
    image: acryldata/datahub-frontend-react:v1.7.0
    hostname: datahub-frontend-react
    depends_on:
      datahub-gms:
        condition: service_healthy
    environment:
      DATAHUB_APP_VERSION: v1.7.0
      DATAHUB_BASE_PATH: /
      DATAHUB_GMS_BASE_PATH: /
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
      DATAHUB_PLAY_MEM_BUFFER_SIZE: 10MB
      DATAHUB_SECRET: ${DATAHUB_SECRET:-nullspace-local-demo-frontend-secret-change-me}
      DATAHUB_TRACKING_TOPIC: DataHubUsageEvent_v1
      FRONTEND_GRACEFUL_SHUTDOWN_ENABLED: "false"
      JAVA_OPTS: >-
        -Xms512m -Xmx512m -Dhttp.port=9002
        -Dconfig.file=datahub-frontend/conf/application.conf
        -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf
        -Dlogback.configurationFile=datahub-frontend/conf/logback.xml
        -Dpidfile.path=/dev/null
      KAFKA_BOOTSTRAP_SERVER: broker:29092
      PLAY_HTTP_CONTEXT: /
      THEME_V2_DEFAULT: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --fail http://datahub-frontend-react:9002/"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
    ports:
      - "9002:9002"

  warehouse:
    image: postgres:16.4
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d warehouse"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./infra/warehouse/init.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro

  metadata-ingestion:
    image: acryldata/datahub-ingestion:v1.7.0
    command: ["ingest", "-c", "/recipe/postgres.yml"]
    depends_on:
      datahub-gms:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    volumes:
      - ./infra/datahub/postgres.yml:/recipe/postgres.yml:ro
    restart: "no"

volumes:
  datahub-broker:
  datahub-mysql:
  datahub-opensearch:
  warehouse-data:
