source:
  type: postgres
  config:
    host_port: warehouse:5432
    database: warehouse
    username: agent
    password: agent
    platform_instance: local-warehouse
    env: DEV
    schema_pattern:
      allow:
        - "^ecommerce$"
    include_tables: true
    include_views: true
    profiling:
      enabled: true
      profile_table_level_only: false

sink:
  type: datahub-rest
  config:
    server: http://datahub-gms:8080
